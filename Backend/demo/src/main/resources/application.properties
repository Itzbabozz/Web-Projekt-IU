spring.application.name=project-management-platform
server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/project_management}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:project_app}
spring.datasource.password=${DB_PASSWORD:project_dev_password}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false

jwt.secret=change-this-secret-key-for-production-1234567890
jwt.expiration-ms=1800000

